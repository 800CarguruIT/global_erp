services:
  postgres:
    image: postgres:16
    container_name: global-erp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: global-erp-adminer-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: global-erp-web-dev
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev"

volumes:
  postgres_dev_data:
