services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: global_erp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/global_erp_dev
      NODE_ENV: development
      PORT: 3000
      DIALER_WEBHOOK_LOG_PATH: /app/apps/web/data/logs/webhook-dialer.log
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - logs_dev_data:/app/apps/web/data/logs
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev"

volumes:
  postgres_dev_data:
  logs_dev_data:
