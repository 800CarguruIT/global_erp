services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: global_erp_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/global_erp_prod
      NODE_ENV: production
      PORT: 3000
      DIALER_WEBHOOK_LOG_PATH: /app/apps/web/data/logs/webhook-dialer.log
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/apps/web/data/uploads
      - logs_data:/app/apps/web/data/logs

volumes:
  postgres_data:
  uploads_data:
  logs_data:
